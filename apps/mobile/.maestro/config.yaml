# End-to-end journeys on an Android emulator (plan 6.10). The app talks to the
# seeded local test API (apps/api/tests/e2e/server.ts): a donor account
# donor@e2e.ly, one report on Al Jumhuriya St with a photo, and an open repair
# campaign. Run in order; later flows build on the signed-in session.
flows:
  - 01-onboarding.yaml
  - 02-sign-in.yaml
  - 03-home.yaml
  - 04-report-detail.yaml
  - 05-my-reports.yaml
  - 06-settings.yaml
  - 07-new-report.yaml
executionOrder:
  continueOnFailure: false
