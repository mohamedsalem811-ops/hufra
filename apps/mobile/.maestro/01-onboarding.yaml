appId: ly.tripoli.hufra
name: First run - welcome, location and notifications, then the app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# First start switches to Arabic right-to-left and may reload once.
- extendedWaitUntil:
    visible: "ابدأ"
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: "ابدأ"
- extendedWaitUntil:
    visible: "موقعك يضع الحفرة في مكانها"
    timeout: 15000
- tapOn: "السماح بالموقع"
- extendedWaitUntil:
    visible: "اعرف متى تُصلح الحفرة"
    timeout: 15000
- tapOn: "تفعيل الإشعارات"
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 30000
- takeScreenshot: 01-home-first
