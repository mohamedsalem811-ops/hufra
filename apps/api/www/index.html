<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUFRA حفرة</title>
<style>
  html,body{margin:0;height:100%;background:#15181C;color:#fff;font-family:-apple-system,system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center}
  .mark{width:84px;height:84px;border-radius:24px;background:#FFCE00;display:grid;place-items:center;font-size:44px;color:#15181C;font-weight:800}
  h1{margin:0;font-size:28px} p{margin:0;color:#B8BEC6;line-height:1.7}
  button{margin-top:8px;border:0;border-radius:14px;background:#FFCE00;color:#15181C;font-size:17px;font-weight:700;padding:14px 28px}
</style>
</head>
<body>
<main>
  <div class="mark">H</div>
  <h1>حفرة · HUFRA</h1>
  <p id="msg">تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم حاول مرة أخرى.<br>Cannot reach the server. Check your connection and retry.</p>
  <button id="retry">إعادة المحاولة · Retry</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    var u = window.HUFRA_SERVER_URL || localStorage.getItem('hufra_server_url');
    if (u) location.href = u; else location.reload();
  });
</script>
</body>
</html>
