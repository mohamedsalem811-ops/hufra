name: App build (Expo · Android APK & iPhone IPA)

# Installable builds of the new citizen app (apps/mobile) for owner testing:
#   - Android: a release APK (JavaScript bundled inside, no dev server needed),
#     signed with the template's debug key so every new APK installs over the last.
#   - iPhone: an UNSIGNED .ipa that Sideloadly / AltStore re-sign with your own
#     Apple ID when installing (free account: valid 7 days, then re-install).
# Store signing (Play upload key, Apple distribution) comes in Phase 10.
#
# Run it from GitHub: Actions -> "App build" -> Run workflow, or push a tag app-v*.
# It also runs on pull requests that change the app (or this workflow), so every step
# comes with phone builds to install before approving.
# The old Capacitor build (mobile-build.yml) stays until Phase 9.

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'
  pull_request:
    paths:
      - '.github/workflows/app-build.yml'
      - 'apps/mobile/**'
      - 'packages/brand/**'
      - 'packages/contracts/**'

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use the versions bundled with the installed Expo SDK; no calls to expo.dev.
  EXPO_OFFLINE: '1'
  CI: '1'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # No Gradle cache here: the android/ folder only exists after prebuild.

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      # Android push needs the Firebase config of the HUFRA project: add the full
      # google-services.json (Firebase console -> Project settings -> Your apps ->
      # Android app "ly.tripoli.hufra") as the repository secret GOOGLE_SERVICES_JSON.
      # app.config.js picks the file up. Without the secret the APK builds without push.
      - name: Add Firebase config (google-services.json) for push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node -e 'const j=require("./google-services.json"); const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==="ly.tripoli.hufra"); if(!ok){console.error("google-services.json has no Android app with package ly.tripoli.hufra"); process.exit(1)} console.log("Firebase project:", j.project_info.project_id)'
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set - the APK will build without push notifications."
          fi

      - name: Generate the native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64 + armv7 phones)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          name="HUFRA-${version}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=apps/mobile/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: HUFRA-Android-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

  ios:
    name: iPhone IPA (unsigned, for Sideloadly)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Generate the native iOS project and install pods (expo prebuild)
        run: npx expo prebuild --platform ios

      - name: Build the app without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/HUFRA.xcworkspace \
            -scheme HUFRA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package the .ipa
        id: ipa
        run: |
          version=$(node -p "require('./app.json').expo.version")
          name="HUFRA-${version}-${GITHUB_SHA::7}-unsigned.ipa"
          rm -rf Payload && mkdir Payload
          cp -R ios/build/Build/Products/Release-iphoneos/HUFRA.app Payload/
          zip -qry "$name" Payload
          echo "path=apps/mobile/$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: HUFRA-iOS-IPA
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 30
