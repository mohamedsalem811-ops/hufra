
name: CI

# HUFRA / حفرة CI pipeline.
# Typecheck -> build -> test -> apply D1 migrations -> deploy to Cloudflare Pages.
# The backend lives in apps/api (npm workspaces); dependencies install at the repo root.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs (Actions -> CI -> Run workflow) on any branch. They only run
  # the checks: the deploy job below is limited to pushes to main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of applying database
  # migrations. Pull-request runs are still cancelled when superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: "Shared packages: brand (WCAG contrast, generated files) and contracts"
        working-directory: .
        run: npm run test:packages

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Vite -> Cloudflare Pages)
        run: npm run build

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Enforce minimum coverage threshold (>=70% statements)
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const pct = summary.total.statements.pct;
            console.log('Statement coverage: ' + pct + '%');
            if (pct < 70) {
              console.error('Coverage ' + pct + '% is below the required 70% threshold.');
              process.exit(1);
            }
          "

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 14

  mobile-app:
    name: "Mobile app (Expo): typecheck, lint, test, bundle"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Use the versions bundled with the installed Expo SDK; no calls to expo.dev.
      EXPO_OFFLINE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Bundle for Android and iOS (proves the JavaScript compiles and assets resolve)
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"

  admin-panel:
    name: "Admin panel: typecheck, test, build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage floors (vite.config.ts)
        run: npm run test:coverage

      - name: Build
        run: npx vite build

  website:
    name: "Website (Astro): check, build, budget and browser tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Typecheck (astro check)
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Plan 8.6: what a first visit downloads per page (HTML, CSS, scripts, fonts, logos).
      - name: Performance budget
        run: npm run budget

      # Chromium for the pinned @playwright/test version, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Every page in Arabic and English, on desktop and phone: accessibility (axe),
      # no sideways scrolling, no script errors; shared reports; search-engine files.
      - name: Browser tests
        run: npm run e2e

      - name: Upload the report and screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: website-e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  admin-e2e:
    name: "Admin panel: browser tests (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      # Chromium for the pinned @playwright/test version, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts the real API on its seeded in-memory database and the panel, then
      # walks through sign-in, reports, donations, admins, duplicates, every page
      # with an accessibility check (axe), and a phone-sized pass.
      - name: Browser tests
        run: npm run e2e

      - name: Upload the report and screenshots when something failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: admin-e2e-report
          path: |
            apps/admin/playwright-report/
            apps/admin/test-results/
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Build for production
        run: npm run build

      # Apply any new database migrations (migrations/*.sql) to the production
      # D1 database BEFORE the new code goes live, so the code never runs
      # against an older schema. Already-applied migrations are skipped, so
      # this is a no-op when nothing changed. If a migration fails, the job
      # stops here and the previous version of the site stays online.
      # The CLOUDFLARE_API_TOKEN secret needs the "D1: Edit" permission.
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply hufra-production --remote
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name hufra --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Plan 9.1: one Worker serves everything: the API, the website (root), the
  # admin panel (/admin/) and, until plan 9.2, the old citizen pages
  # (apps/api/wrangler.worker.jsonc). It deploys only from main, after every
  # check above has passed. The old Pages project keeps its own deploy until 9.2.
  deploy-worker:
    name: Deploy to Cloudflare Workers
    needs: [build-and-test, mobile-app, admin-panel, website, admin-e2e, deploy]
    if: >-
      always() && needs.build-and-test.result == 'success' && needs.mobile-app.result == 'success' &&
      needs.admin-panel.result == 'success' && needs.website.result == 'success' && needs.admin-e2e.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    permissions:
      contents: read
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      # The website and the admin panel, assembled with the old pages' files and
      # the security headers into site/ (scripts/assemble-site.ts).
      - name: Build the website and the admin panel
        run: npm run build:site

      # No-op on main (the Pages job already applied them); needed on manual runs.
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply hufra-production --remote -c wrangler.worker.jsonc

      - name: Deploy the Worker
        id: deploy
        run: |
          npx wrangler deploy -c wrangler.worker.jsonc --define "__BUILD_ID__:\"${GITHUB_SHA::8}\"" | tee deploy.log
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $URL"

      # The login-signing secret cannot be copied from Pages (it was never shown),
      # so the first deploy generates a new random one, stored only in Cloudflare.
      - name: Ensure the JWT_SECRET secret exists on the Worker
        run: |
          if npx wrangler secret list -c wrangler.worker.jsonc | grep -q '"JWT_SECRET"'; then
            echo "JWT_SECRET already set (kept)."
          else
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET -c wrangler.worker.jsonc
            echo "JWT_SECRET generated and stored on the Worker (never printed)."
          fi

      # Android push: the Firebase service-account key lives in the GitHub
      # secret FCM_SERVICE_ACCOUNT (added in the browser, no computer needed)
      # and is copied to the Worker on every deploy. It is checked first and
      # never printed. Without the secret, push is simply off.
      - name: Copy the FCM_SERVICE_ACCOUNT secret to the Worker (Android push)
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::warning::FCM_SERVICE_ACCOUNT secret not set - push notifications stay off."
            exit 0
          fi
          printf '%s' "$FCM_SERVICE_ACCOUNT" | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              let j; try { j = JSON.parse(s) } catch { console.error("FCM_SERVICE_ACCOUNT is not valid JSON (paste the whole key file)"); process.exit(1) }
              if (j.type !== "service_account" || !j.project_id || !j.client_email || !j.private_key) {
                console.error("FCM_SERVICE_ACCOUNT is not a Firebase service-account key (Project settings -> Service accounts -> Generate new private key)"); process.exit(1)
              }
              console.log("Firebase project:", j.project_id)
            })'
          printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT -c wrangler.worker.jsonc
          echo "FCM_SERVICE_ACCOUNT stored on the Worker (never printed)."

      # Check the LIVE Worker after every deploy (from GitHub's network).
      - name: Smoke test the live Worker
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -u
          test -n "$URL" || { echo "No Worker URL found in the deploy output"; exit 1; }
          check() { # path expected-status
            for i in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$URL$1")"
              [ "$code" = "$2" ] && { echo "ok   $1 -> $code"; return 0; }
              sleep 3
            done
            echo "FAIL $1 -> $code (expected $2)"; return 1
          }
          header() { curl -s -D - -o /dev/null "$URL$1" | tr -d '\r' | grep -i "^$2:" | head -1; }
          # Website, shared reports, search-engine files
          check / 200
          check /en 200
          check /how 200
          check /transparency 200
          check /privacy 200
          check /delete-account 200
          check /r 200
          check /sitemap.xml 200
          check /robots.txt 200
          check /.well-known/assetlinks.json 200
          check /how/ 307
          # Admin panel (its screens too) and the API
          check /admin 200
          check /admin/reports 200
          check /api/regions 200
          check /api/potholes/counters 200
          check /api/site/numbers 200
          # The old pages until plan 9.2, and old addresses leading to new pages
          check /map 200
          check /donations 200
          check /static/js/api.js 200
          check /trust 301
          check /pothole/abc 404
          # Security headers per surface (src/lib/security-headers.ts)
          header / content-security-policy | grep -q "script-src 'self'; script-src-attr 'none'" && header / content-security-policy | grep -q "frame-ancestors 'none'" && echo "ok   website policy" || { echo "FAIL website policy"; exit 1; }
          [ "$(curl -s -D - -o /dev/null "$URL/" | grep -ci '^content-security-policy:')" = "1" ] && echo "ok   one policy header" || { echo "FAIL policy header count"; exit 1; }
          header /admin/reports content-security-policy | grep -q "frame-ancestors 'none'" && header /admin x-robots-tag | grep -qi noindex && echo "ok   admin policy and noindex" || { echo "FAIL admin headers"; exit 1; }
          header /api/regions content-security-policy | grep -q "default-src 'none'" && echo "ok   API policy" || { echo "FAIL API policy"; exit 1; }
          header /map content-security-policy | grep -q "nominatim.openstreetmap.org" && echo "ok   old pages policy" || { echo "FAIL old pages policy"; exit 1; }
          header / strict-transport-security | grep -q "max-age=" && echo "ok   HSTS" || { echo "FAIL HSTS"; exit 1; }
          A="$(curl -s "$URL/" | grep -o '/_astro/[^"]*\.css' | head -1)"
          header "$A" cache-control | grep -q "immutable" && echo "ok   website files cached for a year" || { echo "FAIL website file caching ($A)"; exit 1; }
          curl -sI "$URL/static/vendor/leaflet/leaflet.js" | grep -qi "cache-control: public, max-age=31536000, immutable" && echo "ok   old static cache headers"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/auth/login" -H 'content-type: application/json' -d '{"email":"smoke-test@example.com","password":"not-the-password"}')"
          [ "$code" = "401" ] && echo "ok   login rejects a wrong password (401)" || { echo "FAIL login -> $code (expected 401)"; exit 1; }
          echo "Live Worker OK: $URL"
