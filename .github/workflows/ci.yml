
name: CI

# HUFRA / حفرة CI pipeline.
# Typecheck -> build -> test -> apply D1 migrations -> deploy to Cloudflare Pages.
# The backend lives in apps/api (npm workspaces); dependencies install at the repo root.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs (Actions -> CI -> Run workflow) on any branch. They only run
  # the checks: the deploy job below is limited to pushes to main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of applying database
  # migrations. Pull-request runs are still cancelled when superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Shared packages (typecheck, tests incl. WCAG contrast, generated files up to date)
        working-directory: .
        run: npm run test:packages

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Vite -> Cloudflare Pages)
        run: npm run build

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Enforce minimum coverage threshold (>=70% statements)
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const pct = summary.total.statements.pct;
            console.log('Statement coverage: ' + pct + '%');
            if (pct < 70) {
              console.error('Coverage ' + pct + '% is below the required 70% threshold.');
              process.exit(1);
            }
          "

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Build for production
        run: npm run build

      # Apply any new database migrations (migrations/*.sql) to the production
      # D1 database BEFORE the new code goes live, so the code never runs
      # against an older schema. Already-applied migrations are skipped, so
      # this is a no-op when nothing changed. If a migration fails, the job
      # stops here and the previous version of the site stays online.
      # The CLOUDFLARE_API_TOKEN secret needs the "D1: Edit" permission.
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply hufra-production --remote
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name hufra --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
