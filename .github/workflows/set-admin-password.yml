name: Set admin password

# Creates a super admin, or resets an existing account's password and makes it
# super admin, in the PRODUCTION D1 database. Same as running
# `npm run admin:set-password -- --email <email>` locally (apps/api/scripts/set-admin-password.mjs):
# 12+ characters, the published default password is refused, and all of that
# account's existing sessions are signed out.
#
# Run it from Actions -> Set admin password -> Run workflow.
# The password is masked in the logs. Inputs of a manual run are stored with
# the run, visible only to people with access to this (private) repository.
# Change the password again from the app/website once you can log in.

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Admin email (login name)'
        required: true
        default: 'admin@hufra.ly'
      password:
        description: 'New password (12+ characters)'
        required: true

permissions:
  contents: read

concurrency:
  group: set-admin-password
  cancel-in-progress: false

jobs:
  set-password:
    name: Set admin password in production
    runs-on: ubuntu-latest
    steps:
      - name: Hide the password in the logs
        run: |
          PW="$(jq -r '.inputs.password' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$PW"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Set the password (production D1)
        working-directory: apps/api
        run: node scripts/set-admin-password.mjs --email "$ADMIN_EMAIL" --remote
        env:
          ADMIN_EMAIL: ${{ inputs.email }}
          ADMIN_PASSWORD: ${{ inputs.password }}
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
